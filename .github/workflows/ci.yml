name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-website
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install_args: node pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify Cloudflare bundle
        run: pnpm run deploy:dry-run

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: jdx/mise-action@v4
      - name: Install SDL3
        run: brew install sdl3 msdf-atlas-gen
      - name: Prepare Odin vendor libraries
        run: |
          make -C "$(odin root)/vendor/stb/src"
          case "$(uname -m)" in
            arm64) WGPU_ARCH="aarch64" ;;
            x86_64) WGPU_ARCH="x86_64" ;;
            *) echo "unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          WGPU_ARCHIVE="wgpu-macos-$WGPU_ARCH-release.zip"
          WGPU_VERSION="v29.0.1.1"
          WGPU_LIB_DIR="$(odin root)/vendor/wgpu/lib"
          WGPU_PACKAGE="${WGPU_ARCHIVE%.zip}"
          mkdir -p "$WGPU_LIB_DIR/$WGPU_PACKAGE"
          curl --fail --location --retry 3 \
            "https://github.com/gfx-rs/wgpu-native/releases/download/$WGPU_VERSION/$WGPU_ARCHIVE" \
            --output "/tmp/$WGPU_ARCHIVE"
          unzip -q "/tmp/$WGPU_ARCHIVE" -d "$WGPU_LIB_DIR/$WGPU_PACKAGE"
      - name: Test
        run: mise test
      - name: Offscreen Metal acceptance
        id: gpu-acceptance
        run: mise test-gpu-offscreen -- --out "$RUNNER_TEMP/scrapbot-gpu-offscreen"
      - name: Upload offscreen Metal artifacts
        if: always() && steps.gpu-acceptance.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: gpu-offscreen-macos-${{ runner.arch }}
          path: ${{ runner.temp }}/scrapbot-gpu-offscreen
          if-no-files-found: error
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    container: ubuntu:25.10
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git unzip xz-utils zstd build-essential clang cmake ninja-build pkg-config libfreetype-dev libpng-dev libsdl3-dev
      - name: Install msdf-atlas-gen 1.4.0
        run: |
          git clone --filter=blob:none https://github.com/Chlumsky/msdf-atlas-gen.git /tmp/msdf-atlas-gen
          git -C /tmp/msdf-atlas-gen checkout 2ede254314a2512252a225fa6c975948d6af559a
          git -C /tmp/msdf-atlas-gen submodule update --init --recursive --depth 1
          cmake -S /tmp/msdf-atlas-gen -B /tmp/msdf-atlas-gen-build -G Ninja \
            -DMSDF_ATLAS_USE_VCPKG=OFF \
            -DMSDF_ATLAS_USE_SKIA=OFF \
            -DMSDF_ATLAS_NO_ARTERY_FONT=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/msdf-atlas-gen-build
          install /tmp/msdf-atlas-gen-build/bin/msdf-atlas-gen /usr/local/bin/msdf-atlas-gen
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: jdx/mise-action@v4
      - name: Prepare Odin vendor libraries
        run: |
          make -C "$(odin root)/vendor/stb/src"
          WGPU_ARCHIVE="wgpu-linux-x86_64-release.zip"
          WGPU_VERSION="v29.0.1.1"
          WGPU_LIB_DIR="$(odin root)/vendor/wgpu/lib"
          WGPU_PACKAGE="${WGPU_ARCHIVE%.zip}"
          mkdir -p "$WGPU_LIB_DIR/$WGPU_PACKAGE"
          curl --fail --location --retry 3 \
            "https://github.com/gfx-rs/wgpu-native/releases/download/$WGPU_VERSION/$WGPU_ARCHIVE" \
            --output "/tmp/$WGPU_ARCHIVE"
          unzip -q "/tmp/$WGPU_ARCHIVE" -d "$WGPU_LIB_DIR/$WGPU_PACKAGE"
      - name: Test
        run: mise test
      - name: AddressSanitizer
        run: mise test-sanitize

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: jdx/mise-action@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install SDL3
        shell: pwsh
        run: |
          $sdlVersion = "3.4.10"
          $archive = Join-Path $env:RUNNER_TEMP "SDL3-devel-$sdlVersion-VC.zip"
          $installDir = Join-Path $env:RUNNER_TEMP "sdl3"
          Invoke-WebRequest -Uri "https://www.libsdl.org/release/SDL3-devel-$sdlVersion-VC.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $installDir
          $sdlRoot = Join-Path $installDir "SDL3-$sdlVersion"
          Copy-Item "$sdlRoot\lib\x64\SDL3.lib" .
      - name: Prepare Odin vendor libraries
        shell: pwsh
        run: |
          $odin = Join-Path (mise where odin) "odin.exe"
          $odinRoot = & $odin root
          Push-Location "$odinRoot\vendor\stb\src"
          try {
            & .\build.bat
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

          Push-Location "$odinRoot\vendor\cgltf\src"
          try {
            & .\build.bat
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

          $wgpuArchive = "wgpu-windows-x86_64-msvc-release.zip"
          $wgpuVersion = "v29.0.1.1"
          $wgpuPackage = [System.IO.Path]::GetFileNameWithoutExtension($wgpuArchive)
          $wgpuLibDir = Join-Path $odinRoot "vendor\wgpu\lib\$wgpuPackage"
          $wgpuDownload = Join-Path $env:RUNNER_TEMP $wgpuArchive
          New-Item -ItemType Directory -Force -Path $wgpuLibDir | Out-Null
          Invoke-WebRequest -Uri "https://github.com/gfx-rs/wgpu-native/releases/download/$wgpuVersion/$wgpuArchive" -OutFile $wgpuDownload
          & tar.exe -xf $wgpuDownload -C $wgpuLibDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check
        shell: pwsh
        run: |
          $odin = Join-Path (mise where odin) "odin.exe"
          & $odin check src/scrapbot -no-entry-point
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
